<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yahoo Finance browser test</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 720px; margin: 0 auto; padding: 24px; color: #263d40; background: #f4f0e7; }
    label { display: block; margin: 12px 0 6px; font-weight: 700; }
    input, button { min-height: 42px; border: 1px solid #cfc8ba; border-radius: 10px; padding: 0 12px; font: inherit; }
    input { width: 100%; box-sizing: border-box; background: #fffefa; }
    button { margin-top: 14px; cursor: pointer; background: #2e7567; color: white; border-color: #2e7567; }
    pre { min-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-word; border-radius: 10px; padding: 14px; background: #fffefa; border: 1px solid #cfc8ba; }
    .hint { color: #586969; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Yahoo Finance browser test</h1>
  <p class="hint">
    Run this page from an HTTP/HTTPS site, ideally the actual Squarespace domain.
    Double-clicking the file and opening it as <code>file://</code> is not a valid
    CORS test.
  </p>

  <label for="symbol">Yahoo symbol</label>
  <input id="symbol" value="AAPL" autocomplete="off" spellcheck="false">
  <button id="run" type="button">Test Yahoo chart request</button>
  <pre id="output">No request yet.</pre>

  <script>
    const symbolInput = document.getElementById('symbol');
    const output = document.getElementById('output');
    const runButton = document.getElementById('run');

    const print = value => {
      output.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
    };

    runButton.addEventListener('click', async () => {
      const symbol = symbolInput.value.trim().toUpperCase();
      if (!symbol) {
        print('Enter a Yahoo symbol, for example AAPL or VUSA.L.');
        return;
      }

      const url = 'https://query1.finance.yahoo.com/v8/finance/chart/'
        + encodeURIComponent(symbol) + '?range=1d&interval=1d';
      print('Requesting:\\n' + url + '\\n\\nWaiting...');

      try {
        const response = await fetch(url, {
          method: 'GET',
          mode: 'cors',
          headers: { Accept: 'application/json' }
        });
        const text = await response.text();
        let body;
        try { body = JSON.parse(text); } catch (_) { body = text; }

        print({
          pageOrigin: window.location.origin,
          httpStatus: response.status,
          corsRequestCompleted: true,
          yahooError: body?.chart?.error || null,
          sample: body?.chart?.result?.[0]
            ? {
                symbol: body.chart.result[0].meta?.symbol,
                currency: body.chart.result[0].meta?.currency,
                regularMarketPrice: body.chart.result[0].meta?.regularMarketPrice,
                timestamps: body.chart.result[0].timestamp?.length || 0
              }
            : String(text).slice(0, 500)
        });
      } catch (error) {
        print({
          pageOrigin: window.location.origin,
          corsRequestCompleted: false,
          likelyCause: 'The browser blocked the cross-origin request, or Yahoo was unavailable/rate-limited.',
          error: String(error)
        });
      }
    });
  </script>
</body>
</html>
